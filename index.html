<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Halloween Kulangot 🎃</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Background -->
  <div class="moon"></div>

  <div class="pumpkin pumpkin-one">🎃</div>
  <div class="pumpkin pumpkin-two">🎃</div>

  <div class="ghost">👻</div>

  <div class="bat bat-one">🦇</div>
  <div class="bat bat-two">🦇</div>

  <!-- Main Content -->
  <main class="card">

    <div class="skull">💀</div>

    <h1>HALLOWEEN</h1>

    <p class="question">
      Ok ka lng <span>kulangot?</span> 👃
    </p>

    <div class="buttons-area">

      <button id="yesBtn">
        YES 😈
      </button>

      <button id="noBtn">
        NO 👻
      </button>

    </div>

    <div id="message">
      Pautang 1k balik ko sa katapusan boi 💀😂
    </div>

    <p class="hint">
      Hmm... try mo pindutin yung NO. 👀
    </p>

  </main>

  <script src="script.js"></script>

</body>
</html>
